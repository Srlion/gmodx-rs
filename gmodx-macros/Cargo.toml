[package]
name = "gmodx-macros"
version = "0.5.0"
edition = "2024"
description = "Proc macros for gmodx-rs"
repository = "https://github.com/Srlion/gmodx-rs"
license = "MIT"

[lib]
proc-macro = true

[dependencies]
proc-macro-crate = "3.4.0"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
